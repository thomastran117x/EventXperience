  /api/auth/username/availability:
    get:
      tags:
        - auth
      summary: Check username availability
      description: "Anonymous by necessity — it serves the signup form, where there is no session yet — and\r\ntherefore an enumeration surface, which is why it carries its own rate-limit policy\r\nrather than the global one. It returns nothing beyond a boolean; a caller learns only\r\nwhat they would learn by attempting to sign up.\r\n\r\nThe answer is advisory. It is not a reservation, and a name reported free can be taken\r\na moment later; the unique index is what actually decides."
      operationId: Auth_CheckUsernameAvailability_get
      parameters:
        - name: username
          in: query
          schema:
            $ref: '#/components/schemas/String'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiResponseOfUsernameAvailabilityResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOfUsernameAvailabilityResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOfUsernameAvailabilityResponse'
        '400':
          description: 'Bad request, validation failure, or CSRF failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOfObject'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOfObject'
  /api/auth/username/suggestions:
    get:
      tags:
        - auth
      summary: Suggest usernames
      description: "Anonymous for the same reason the availability probe is: it serves the signup form,\r\nwhere there is no session yet. The account rename form reuses it rather than having an\r\nauthenticated twin — the answer depends on nothing about the caller, and a user's own\r\ncurrent name already reads as unavailable, so it can never be suggested back to them.\r\n\r\nAdvisory, exactly like the probe next to it. Nothing here is reserved: two callers can\r\nbe handed the same name in the same moment, and a name offered here can be claimed\r\nbefore it is submitted. The unique index is what decides.\r\n\r\nA short list, or an empty one, is a normal response rather than an error. Suggestions\r\ndecorate a form that works without them, so an exhausted draw must degrade to no chips\r\ninstead of failing a signup."
      operationId: Auth_SuggestUsernames_get
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiResponseOfUsernameSuggestionsResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOfUsernameSuggestionsResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOfUsernameSuggestionsResponse'
        '400':
          description: 'Bad request, validation failure, or CSRF failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOfObject'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOfObject'
  /api/auth/email/availability:
    get:
      tags:
        - auth
      summary: Check email availability
      description: "Anonymous by necessity — it serves the signup form, where there is no session yet — and\r\ntherefore an account-existence oracle, accepted deliberately because the signup UX is\r\njudged to be worth it.\r\n\r\nBe clear about what that costs: this is strictly cheaper to script than the signup it\r\nserves. `LocalSignup` requires an antiforgery token and a passing captcha; this\r\nrequires neither and answers with a boolean. So existence testing that was previously\r\nbehind a captcha is now bounded only by\r\nstring RateLimiterConfiguration.EmailAvailabilityPolicyName, which is why that\r\npolicy is half the username budget. Gate this endpoint, or lower that limit, if\r\nenumeration ever matters more than the type-ahead. See the bloom filter section of\r\ndocs/CONFIGURATION.md.\r\n\r\nThe answer is advisory. An address reported free can be registered a moment later; the\r\nunique index is what actually decides."
      operationId: Auth_CheckEmailAvailability_get
      parameters:
        - name: email
          in: query
          schema:
            $ref: '#/components/schemas/String'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiResponseOfEmailAvailabilityResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOfEmailAvailabilityResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOfEmailAvailabilityResponse'
        '400':
          description: 'Bad request, validation failure, or CSRF failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOfObject'
        '500':
          description: Unexpected server error.
