            - $ref: '#/components/schemas/Double'
        maxParticipants:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Int32'
        registerCost:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Int32'
        isPrivate:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Boolean'
        waitlistEnabled:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Boolean'
        category:
          oneOf:
            - type: 'null'
            - description: 'Annotated so the category can be posted as its name, e.g. "Gaming".'
              $ref: '#/components/schemas/EventCategory'
        tags:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ListOfString'
        imageUrls:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ListOfString'
        localStartTime:
          oneOf:
            - type: 'null'
            - description: 'New local start time-of-day, as `HH:mm`, interpreted in the series'' zone.'
              $ref: '#/components/schemas/String'
        durationMinutes:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Int32'
      description: "    Applies a patch to every future occurrence from a pivot onward.\r\n    There is deliberately no StartTime/EndTime here. Retiming a series is expressed\r\nas a local wall-clock time plus the series' own zone, so a shifted series survives DST the\r\nsame way the original generation did; accepting a UTC instant would reintroduce the drift."
    UpdateProfileRequest:
      type: object
      properties:
        name:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/String'
        phone:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/String'
        address:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/String'
    UpdateRegistrationRequest:
      type: object
      properties:
        notes:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/String'
        phoneNumber:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/String'
        dietaryNeeds:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/String'
    UpdateUserStatusRequest:
      type: object
      properties:
        isDisabled:
          $ref: '#/components/schemas/Boolean'
        reason:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/String'
    UsernameAvailabilityResponse:
      required:
        - username
        - available
      type: object
      properties:
        username:
          description: 'The normalised form the username was checked as, so the client can show what it evaluated.'
          $ref: '#/components/schemas/String'
        available:
          description: "True when nothing currently holds the name. Advisory only: the name is not reserved by\r\nasking, and signup can still fail with USERNAME_TAKEN if someone claims it first."
          $ref: '#/components/schemas/Boolean'
      description: Result of a username availability probe.
    UsernameRecoveryRequest:
      required:
        - email
        - captcha
      type: object
      properties:
        email:
          $ref: '#/components/schemas/String'
        captcha:
          $ref: '#/components/schemas/String'
    UsernameSuggestionResponse:
      required:
        - username
        - display
      type: object
      properties:
        username:
          description: 'The normalised, claimable form, e.g. `smartcat23`.'
          $ref: '#/components/schemas/String'
        display:
          description: 'The same name as it should be rendered, e.g. `SmartCat23`.'
          $ref: '#/components/schemas/String'
      description: 'One suggested username, in both the form that is claimed and the form that is shown.'
    UsernameSuggestionsResponse:
      required:
        - suggestions
      type: object
      properties:
        suggestions:
          description: "The suggestions, free at the moment they were drawn. May hold fewer than the usual three,\r\nor none: suggestions are a convenience, so an exhausted draw returns a short list rather\r\nthan failing the request, and the form works without them."
          $ref: '#/components/schemas/IReadOnlyListOfUsernameSuggestionResponse'
      description: A batch of suggested usernames for the signup and rename forms.
    UserStatusResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Int32'
        isDisabled:
          $ref: '#/components/schemas/Boolean'
        disabledAtUtc:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/DateTime'
        disabledReason:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/String'
        authVersion:
          $ref: '#/components/schemas/Int32'
    VerificationChallengeResponse:
      required:
        - challenge
      type: object
      properties:
        challenge:
          $ref: '#/components/schemas/String'
        expiresAtUtc:
          $ref: '#/components/schemas/DateTime'
    VerificationTokenRequest:
      required:
        - token
      type: object
      properties:
        token:
          $ref: '#/components/schemas/String'
        transport:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/String'
    VerifyLoginStepUpRequest:
      required:
        - challenge
        - code
      type: object
      properties:
        challenge:
          $ref: '#/components/schemas/String'
        code:
          $ref: '#/components/schemas/String'
    WaitlistedEventResponse:
      type: object
      properties:
        entryId:
          $ref: '#/components/schemas/Int32'
        position:
          $ref: '#/components/schemas/Int32'
        joinedAtUtc:
          $ref: '#/components/schemas/DateTime'
        accessRevoked:
          description: "True when the user can no longer view this event (e.g. a private-event invitation was\r\nrevoked after they queued). EventResponse WaitlistedEventResponse.Event is then redacted down to its id, but\r\nthe row is still returned so the user retains a way to withdraw and have their stored\r\ncontact details removed — omitting it entirely would strand them in the queue."
          $ref: '#/components/schemas/Boolean'
        event:
          $ref: '#/components/schemas/EventResponse'
      description: 'An event the current user is queued for, with their place in line.'
    WaitlistPromotionResultResponse:
      type: object
      properties:
        promotedCount:
          $ref: '#/components/schemas/Int32'
        promotedUserIds:
          $ref: '#/components/schemas/ListOfInt32'
  securitySchemes:
    bearerAuth:
      type: http
      description: 'Send the access token in the Authorization header as `Bearer {token}` for protected API routes.'
      scheme: bearer
      bearerFormat: JWT
tags:
  - name: auth
    description: 'Authentication, session, CSRF, verification, and password recovery flows.'
  - name: clubs
    description: 'Club management, discovery, membership, reviews, staff, and club content.'
  - name: events
    description: 'Event CRUD, search, drafts, invitations, registrations, analytics, and assets.'
  - name: payments
    description: 'Stripe checkout, payment retrieval, refunds, and webhook processing.'
  - name: users
    description: 'User-centric resources such as followed clubs, reviews, and registrations.'
  - name: admin
    description: 'Administrative endpoints for moderation, user management, and reindex operations.'